aid: beengo
name: Beengo
description: Beengo operates as Appfront (appfront.ai), an all-in-one restaurant engagement
  and eCommerce platform backed by 500 Global. The platform gives restaurants branded online
  ordering, dine-in scan-and-pay, loyalty and CRM, SMS/push/email marketing campaigns, gift
  cards and payments, branded native iOS/Android apps, and data analytics. It integrates with
  major point-of-sale systems (Toast, Revel, SpeedLine, Square, Clover, PAR/Brink, Oracle
  Hospitality MICROS, NCR) and third-party delivery (DoorDash, Postmates). No public developer
  program, OpenAPI, or API documentation is published at this time; this profile captures the
  company identity, web properties, and probed domain security posture.
